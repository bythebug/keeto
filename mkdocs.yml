site_name: Keeto
site_description: Zero-config AI observability for Python — automatic tracing, cost tracking, and dashboards in two lines.
site_url: https://bythebug.github.io/keeto
repo_url: https://github.com/bythebug/keeto
repo_name: bythebug/keeto
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  custom_dir: docs/overrides

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: quickstart.md
    - Installation: installation.md
    - Configuration: configuration.md
  - Integrations:
    - Overview: integrations/index.md
    - OpenAI: integrations/openai.md
    - Anthropic: integrations/anthropic.md
    - LangChain: integrations/langchain.md
    - LlamaIndex: integrations/llamaindex.md
    - LiteLLM: integrations/litellm.md
    - Google Gemini: integrations/gemini.md
    - Ollama: integrations/ollama.md
    - OpenAI Agents SDK: integrations/openai-agents.md
    - PydanticAI: integrations/pydantic-ai.md
    - FastAPI: integrations/fastapi.md
    - vLLM: integrations/vllm.md
    - Custom Instrumentation: integrations/custom.md
  - Features:
    - Dashboard: dashboard/tui.md
    - Web Dashboard: dashboard/web.md
    - Exporters: exporters/index.md
    - Analysis: analysis/index.md
    - Security & PII: security.md
    - Performance: performance.md
  - CLI Reference: cli.md
  - Plugin Development: plugins/building-plugins.md
  - API Reference: api-reference/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bythebug/keeto
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/keeto

extra_css:
  - stylesheets/extra.css
