[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keeto"
version = "0.1.0"
description = "Zero-config AI observability and debugging for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Keeto Contributors" }]
keywords = ["ai", "observability", "tracing", "llm", "openai", "anthropic", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "anyio>=4.0",
    "httpx>=0.25",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
tui = ["textual>=0.70"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
sqlite = ["aiosqlite>=0.19"]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
postgres = ["asyncpg>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "respx>=0.21",
    "hypothesis>=6.100",
    "syrupy>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "pytest-cov>=5.0",
    "keeto[tui,web,sqlite]",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
all = ["keeto[tui,web,sqlite,otel,postgres]"]

[project.scripts]
keeto = "keeto.cli.main:app"

[project.entry-points."keeto.plugins"]
openai = "keeto.integrations.openai:OpenAIPlugin"
anthropic = "keeto.integrations.anthropic:AnthropicPlugin"
langchain = "keeto.integrations.langchain:LangChainPlugin"
llamaindex = "keeto.integrations.llamaindex:LlamaIndexPlugin"
litellm = "keeto.integrations.litellm:LiteLLMPlugin"
gemini = "keeto.integrations.gemini:GeminiPlugin"
ollama = "keeto.integrations.ollama:OllamaPlugin"
openai_agents = "keeto.integrations.openai_agents:OpenAIAgentsPlugin"
pydantic_ai = "keeto.integrations.pydantic_ai:PydanticAIPlugin"

[project.urls]
Homepage = "https://github.com/keeto-dev/keeto"
Documentation = "https://keeto.dev/docs"
Repository = "https://github.com/keeto-dev/keeto"
Issues = "https://github.com/keeto-dev/keeto/issues"
Changelog = "https://github.com/keeto-dev/keeto/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/keeto"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = [
    "RUF001",   # ambiguous unicode in string literals (em-dash in UI strings is intentional)
    "RUF002",   # ambiguous unicode in docstrings (em-dash is intentional)
    "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["keeto"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: marks tests as integration tests (require API keys, deselect with -m 'not integration')",
    "benchmark: marks tests as performance benchmarks",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/keeto"]
omit = [
    "*/dashboard/*",
    "*/cli/*",
    "*/integrations/*",
    "*/storage/postgres.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
